name: leechx

services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    network_mode: "service:warp"
    depends_on:
      warp:
        condition: service_healthy
    volumes:
      # فایل‌های موقت و دیتابیس — با پاک‌شدن کانتینر از بین نمی‌روند
      - ./data:/app/data
      # بسته‌های pip --user (مثل yt-dlp) — بعد از rebuild/restart هم می‌مانند
      - ./data/pylocal:/home/leechx/.local
      # Local Bot API files (shared with telegram-bot-api)
      - ./data/tg-bot-api:/var/lib/telegram-bot-api
      # کوکی‌ها (اختیاری)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ───────────────────────────────────────────────────────────
  #  Local Bot API Server — برای آپلود/دانلود فایل تا 2GB
  #  اجرا:  docker compose --profile localapi up -d
  #  سپس در .env:
  #    TELEGRAM_API_URL=http://telegram-bot-api:8081/bot
  #    TELEGRAM_API_FILE_URL=http://telegram-bot-api:8081/file/bot
  #  و API_ID / API_HASH را از my.telegram.org بگیر.
  # ───────────────────────────────────────────────────────────
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    profiles: ["localapi"]
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
    command:
      - "--api-id=${TELEGRAM_API_ID}"
      - "--api-hash=${TELEGRAM_API_HASH}"
      - "--local"
      - "--http-port=8081"
      - "--dir=/var/lib/telegram-bot-api"
    volumes:
      - ./data/tg-bot-api:/var/lib/telegram-bot-api
    networks:
      default:
        ipv4_address: 172.18.0.10
    ports:
      - "127.0.0.1:8082:8081"

  # ───────────────────────────────────────────────────────────
  #  Cloudflare WARP — خروج از IP دیتاسنتر برای یوتیوب
  #  ربات داخل network namespace این سرویس اجرا می‌شود.
  # ───────────────────────────────────────────────────────────
  warp:
    build:
      context: ./warp
      args:
        TARGETARCH: amd64
    container_name: leechx-warp
    restart: unless-stopped
    privileged: true
    dns:
      - 1.1.1.1
      - 1.0.0.1
    extra_hosts:
      - "telegram-bot-api:172.18.0.10"
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0
      net.ipv4.conf.all.src_valid_mark: 1
    volumes:
      - warp-data:/data
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wg show wgcf >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  warp-data:
